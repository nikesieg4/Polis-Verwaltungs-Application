name: Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Syntax prüfen
        run: for f in src/*.js src/handlers/*.js scripts/*.js; do node --check "$f"; done
      - name: Shell-Skripte prüfen
        run: for f in scripts/*.sh scripts/bcpp-bot; do bash -n "$f"; done
