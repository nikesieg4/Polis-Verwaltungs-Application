<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="480" viewBox="0 0 1360 480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/><stop offset=".55" stop-color="#0f2a52"/><stop offset="1" stop-color="#1e40af"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <linearGradient id="sh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#0c2a5e"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f5f9"/><stop offset=".5" stop-color="#94a3b8"/><stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect width="1360" height="480" fill="url(#bg)"/>
  <rect width="1360" height="480" fill="url(#grid)"/>
  <!-- large faint shield watermark -->
  <g transform="translate(1010 30) scale(.9)" opacity=".10">
    <path d="M256 52 L420 110 V250 C420 352 350 420 256 462 C162 420 92 352 92 250 V110 Z" fill="#ffffff"/>
  </g>
  <!-- small shield emblem -->
  <g transform="translate(330 92) scale(.42)">
    <path d="M256 52 L420 110 V250 C420 352 350 420 256 462 C162 420 92 352 92 250 V110 Z" fill="url(#rim)"/>
    <path d="M256 74 L400 124 V250 C400 340 338 400 256 438 C174 400 112 340 112 250 V124 Z" fill="url(#sh)"/>
    <path d="M256 170 l17 36 39 5.5 -28 27.5 6.7 39 -34.7 -18.5 -34.7 18.5 6.7 -39 -28 -27.5 39 -5.5 z" fill="#f8fafc"/>
  </g>
  <text x="560" y="168" font-family="Inter" font-weight="600" font-size="26" letter-spacing="6" fill="#93c5fd">BERLIN CITY</text>
  <text x="556" y="236" font-family="Inter Display" font-weight="800" font-size="64" fill="#f8fafc">Polizeipräsidium</text>
  <text x="560" y="290" font-family="Inter" font-weight="500" font-size="30" fill="#cbd5e1">Personalakten · Verwaltung · Highteam</text>
  <!-- police stripe -->
  <rect y="430" width="1360" height="18" fill="#e2e8f0"/>
  <rect y="448" width="1360" height="32" fill="#1d4ed8"/>
</svg>
